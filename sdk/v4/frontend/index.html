<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema de Autorización</title>
    <style>
        /* La sección privada empieza oculta */
        #seccion-privada { display: none; }
        .box { border: 1px solid #ccc; padding: 20px; margin: 20px; border-radius: 8px; max-width: 500px; font-family: sans-serif; }
        .botones-prueba { margin-top: 20px; padding: 15px; background-color: #f9f9f9; border-radius: 5px; }
        .resultado { margin-top: 10px; padding: 10px; font-weight: bold; border: 1px dashed #999; }
        
        button { cursor: pointer; padding: 10px; margin: 5px 0; border-radius: 4px; border: 1px solid #ccc; width: 100%; }
        button:hover { opacity: 0.8; }
        
        /* Colores para distinguir acciones */
        .btn-login { background-color: #007bff; color: white; border: none; }
        .btn-registro { background-color: #6c757d; color: white; border: none; }
        .btn-exito { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .btn-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div id="seccion-inicio" class="box">
        <h1>Acceso al Sistema</h1>
        <label>Usuario:</label>
        <input id="username" style="width: 95%; padding: 5px;" required><br><br>
        <label>Password:</label>
        <input type="password" id="password" style="width: 95%; padding: 5px;" required><br><br>
        
        <button id="btnLogin" class="btn-login">Ingresar</button>
        <button id="btnRegistro" class="btn-registro">Registrarse (Crear nuevo)</button>
    </div>

    <div id="seccion-privada" class="box">
        <h1 id="bienvenida"></h1>
        <p>Has ingresado correctamente al sistema.</p>
        
        <div class="botones-prueba">
            <h3>Pruebas de Autorización (Punto 1 y 2)</h3>
            <p>Probá ejecutar acciones según tus permisos en la DB:</p>
            
            <button class="btn-exito" id="btnLog">Ejecutar /log</button>
            <button class="btn-error" id="btnSayHello">Ejecutar /sayHello</button>
            
            <div id="statusArea" class="resultado">Esperando acción...</div>
        </div>

        <hr>
        <button onclick="location.reload()" style="background: none; color: blue; text-decoration: underline; border: none; width: auto; cursor: pointer;">Cerrar Sesión</button>
    </div>

    <script>
    var usuarioActual = "";

    // FUNCIÓN 1: LOGIN (Modificada con la URL del Backend v4)
    async function alHacerClickEnLogin() {
        var user = document.getElementById('username').value;
        var pass = document.getElementById('password').value;

        if(!user || !pass) return alert("Completá los campos");

        // Apunta directo al puerto 8080 del backend NodeJS
        var response = await fetch('http://127.0.0.1:8080/login', {
            method: 'POST',
            body: JSON.stringify({ username: user, password: pass }),
            headers: { 'Content-Type': 'application/json' }
        });
        
        var session = await response.json();

        if (response.ok && session !== null && session.status === 'enabled') {
            usuarioActual = user;
            mostrarPanelPrivado(user);
        } else {
            alert("Usuario o contraseña incorrectos. Si no tenés cuenta, registrate.");
        }
    }

    // FUNCIÓN 2: REGISTRO (Modificada con la URL del Backend v4)
    async function alHacerClickEnRegistro() {
        var user = document.getElementById('username').value;
        var pass = document.getElementById('password').value;

        if(!user || !pass) return alert("Completá los campos para registrarte");

        // Apunta directo al puerto 8080 del backend NodeJS
        var response = await fetch('http://127.0.0.1:8080/register?username=' + user + '&password=' + pass);
        
        if (response.ok) {
            alert("¡Usuario creado con éxito! Ahora hacé clic en 'Ingresar'.");
        } else {
            var err = await response.json();
            alert("Error al registrar: " + (err.error || "Intentalo de nuevo"));
        }
    }

    function mostrarPanelPrivado(user) {
        document.getElementById('seccion-inicio').style.display = 'none';
        document.getElementById('seccion-privada').style.display = 'block';
        document.getElementById('bienvenida').innerText = "Hola " + user;
    }

    // FUNCIÓN 3: PRUEBA DE PERMISOS (Modificada para usar Cabeceras HTTP Transversales)
    async function probarPermiso(endpoint) {
        var statusArea = document.getElementById('statusArea');
        statusArea.innerText = "Consultando autorizador...";
        statusArea.style.color = "black";

        // Ya NO mandamos '?user=' en la URL. Va limpio.
        var response = await fetch('http://127.0.0.1:8080' + endpoint, {
            method: 'GET', // O el método que corresponda
            headers: {
                'Content-Type': 'application/json',
                'x-user-id': usuarioActual // <--- Inyectamos el usuario en la cabecera personalizada
            }
        });
        
        var data = await response.json();

        if (response.ok) {
            statusArea.style.color = "green";
            statusArea.innerText = "Satisfecho: " + data.message;
        } else {
            statusArea.style.color = "red";
            statusArea.innerText = "Denegado: " + (data.error || "Acceso denegado");
        }
    }

    // Funciones intermedias para evitar las funciones flecha en los onclick
    function manejarClickLog() {
        probarPermiso('/log');
    }

    function manejarClickSayHello() {
        probarPermiso('/sayHello');
    }

    function main() {
        document.getElementById('btnLogin').onclick = alHacerClickEnLogin;
        document.getElementById('btnRegistro').onclick = alHacerClickEnRegistro;
        
        // Asignación con funciones tradicionales referenciadas
        document.getElementById('btnLog').onclick = manejarClickLog;
        document.getElementById('btnSayHello').onclick = manejarClickSayHello;
    }

    window.onload = main;
</script>
</body>
</html>
