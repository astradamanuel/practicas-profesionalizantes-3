<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>W3Admin - Sistema RPC</title>
  
  <!-- CSS del repo del profesor -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="./assets/icons/font-awesome-4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="./assets/css/w3pro-4.13.css">
  <link rel="stylesheet" href="./assets/css/w3-theme.css">
  <link rel="stylesheet" href="./assets/css/admin-styles.css">
  
  <style>
    .vista-oculta { display: none !important; }
    .vista-activa { display: block; }
    .pantalla-centrada { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f5f7; padding: 20px; }
  </style>
</head>

<body class="w3-light-grey">

  <!-- ========================================== -->
  <!-- TEMPLATES (Ocultos por defecto)            -->
  <!-- ========================================== -->

  <!-- Template LOGIN (Extraído de login.html) -->
  <template id="tpl-login">
    <div class="w3-auto" style="width:380px">
      <div class="w3-white w3-round w3-margin-bottom w3-border">
        <div class="w3-padding-large">
          <div class="w3-center w3-padding-16">
            <img src="./assets/admin-logo.png" alt="w3mix" class="w3-image" width="50">
            <p>SIGN IN</p>
          </div>
          <div class="w3-margin-bottom">
            <input id="input-login-user" type="text" class="w3-input w3-round w3-border" placeholder="Enter Username">
          </div>
          <div class="w3-margin-bottom">
            <input id="input-login-pass" type="password" class="w3-input w3-round w3-border" placeholder="Enter Password">
          </div>
          <div class="w3-margin-bottom">
            <div class="icheck-material-white">
              <input id="user-checkbox" class="w3-check" type="checkbox" checked="">
              <label for="user-checkbox">I AGREE WITH TERMS & CONDITIONS</label>
            </div>
          </div>
          <button id="btn-login" type="button" class="w3-button w3-round w3-margin-bottom w3-primary w3-block">Sign In</button>
        </div>
        <div class="w3-center w3-border-top">
          <p class="w3-margin"><span class="w3-text-warning">Do not have an account?</span> <a href="#" id="link-ir-registro"> Sign Up here</a></p>
        </div>
      </div>
    </div>
  </template>

  <!-- Template REGISTER (Extraído de forms.html - Horizontal) -->
  <template id="tpl-register">
    <div class="w3-auto" style="width:100%; max-width:600px;">
      <div class="w3-white w3-round w3-margin-bottom w3-border">
        <header class="w3-padding-large w3-large w3-border-bottom" style="font-weight: 500">REGISTRATION (HORIZONTAL FORM)</header>
        <div class="w3-padding-large">
          <form>
            <div class="w3-row w3-margin-bottom">
              <label class="w3-col l3 m12">Username</label>
              <div class="w3-col l9 m12">
                <input id="input-reg-user" type="text" class="w3-input w3-border w3-round" placeholder="Enter Your Name">
              </div>
            </div>
            <div class="w3-row w3-margin-bottom">
              <label class="w3-col l3 m12">Password</label>
              <div class="w3-col l9 m12">
                <input id="input-reg-pass" type="password" class="w3-input w3-border w3-round" placeholder="Enter Password">
              </div>
            </div>
            <div class="w3-row w3-margin-bottom">
              <div class="w3-col l3 m12">&nbsp;</div>
              <div class="w3-col l9 m12">
                <button id="btn-register" type="button" class="w3-button w3-primary w3-round"><i class="fa fa-fw fa-lock"></i> Register</button>
                <button id="btn-volver-login" type="button" class="w3-button w3-light-grey w3-round w3-margin-left"> Volver al Login </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </template>

  <!-- ========================================== -->
  <!-- RENDERIZADO DE LAS VISTAS                  -->
  <!-- ========================================== -->

  <!-- Contenedor VISTA LOGIN -->
  <div id="vista-login" class="pantalla-centrada vista-activa">
    <wc-login-form-view id="componente-login"></wc-login-form-view>
  </div>

  <!-- Contenedor VISTA REGISTRO -->
  <div id="vista-registro" class="pantalla-centrada vista-oculta">
    <wc-register-form-view id="componente-registro"></wc-register-form-view>
  </div>

  <!-- ========================================== -->
  <!-- SCRIPTS ORDENADOS                          -->
  <!-- ========================================== -->
  <script src="./js/api.js"></script>
  <script src="./js/WCLoginFormView.js"></script>
  <script src="./js/WCRegisterFormView.js"></script>
  <script>
    // Código simple para cambiar vistas e integrar (esto podrías moverlo a main.js)
    function cambiarVista(idVista) {
        document.getElementById('vista-login').className = "vista-oculta";
        document.getElementById('vista-registro').className = "vista-oculta";
        document.getElementById(idVista).className = "pantalla-centrada vista-activa";
    }

    var compLogin = document.getElementById('componente-login');
    var compRegistro = document.getElementById('componente-registro');

    // Escuchamos los eventos despachados por los WebComponents (sin usar funciones flecha)
    compLogin.addEventListener('on-ir-registro', function() {
        cambiarVista('vista-registro');
    });

    compRegistro.addEventListener('on-volver-login', function() {
        cambiarVista('vista-login');
    });

    compLogin.addEventListener('on-intentar-login', async function(evento) {
        var user = evento.detail.user;
        var pass = evento.detail.pass;
        try {
            var data = await RPCWebAPIFetch('/loginUser', { username: user, password: pass });
            alert("Login OK (simulado)");
        } catch(e) {
            alert(e.message);
        }
    });

    compRegistro.addEventListener('on-intentar-registro', async function(evento) {
        var user = evento.detail.user;
        var pass = evento.detail.pass;
        try {
            var data = await RPCWebAPIFetch('/registerUser', { username: user, password: pass });
            alert("Registro OK, volviendo...");
            cambiarVista('vista-login');
        } catch(e) {
            alert(e.message);
        }
    });
  </script>
</body>
</html>
