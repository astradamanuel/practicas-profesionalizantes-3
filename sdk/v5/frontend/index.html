<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Autorización RPC</title>
    
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="w3-light-grey">

    <!-- Vista de Login -->
    <div id="vista-login">
        <wc-login-form-view></wc-login-form-view>
    </div>

    <!-- Vista de Registro -->
    <div id="vista-registro" class="hidden">
        <wc-register-form-view></wc-register-form-view>
    </div>

    <!-- Vista de Dashboard -->
    <div id="vista-dashboard" class="hidden">
        <wc-dashboard-view></wc-dashboard-view>
    </div>

    <script type="module">
        import { mostrarVista } from './js/vistas.js';
        import './js/components/WCLoginFormView.js';
        import './js/components/WCRegisterFormView.js';
        import './js/components/WCDashboardView.js';
        
        document.addEventListener('login-success', function(e) {
            console.log('[App] Login exitoso, mostrando dashboard');
            const dashboard = document.querySelector('wc-dashboard-view');
            if (dashboard && e.detail && e.detail.user) {
                dashboard.setUsuario(e.detail.user);
            }
            mostrarVista('vista-dashboard');
        });
        
        document.addEventListener('show-register-view', function(e) {
            console.log('[App] Cambiando a vista de registro');
            mostrarVista('vista-registro');
        });
        
        document.addEventListener('show-login-view', function(e) {
            console.log('[App] Volviendo a vista de login');
            mostrarVista('vista-login');
        });
        
        mostrarVista('vista-login');
    </script>
</body>
</html>
